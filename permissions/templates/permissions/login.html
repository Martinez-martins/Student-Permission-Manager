{% extends 'permissions/base.html' %}

{% block title %}Login - SPMS{% endblock %}

{% block extra_head %}
<style>
    .auth-wrap {
        max-width: 520px;
        margin: 0 auto;
    }

    .auth-card {
        background: #fff;
        border: 1px solid #d8e4ef;
        border-radius: 16px;
        box-shadow: 0 14px 28px rgba(16, 42, 67, 0.08);
        padding: 30px;
    }

    .auth-title {
        text-align: center;
        color: #0f4c81;
        margin-bottom: 8px;
        font-size: 1.7rem;
    }

    .auth-subtitle {
        text-align: center;
        margin-bottom: 20px;
        color: #5f7183;
        font-size: 0.95rem;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: #2a4a66;
    }

    .form-group input {
        width: 100%;
        padding: 12px;
        border: 1px solid #cbdbea;
        border-radius: 10px;
        font-size: 15px;
        box-sizing: border-box;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .form-group input:focus {
        outline: none;
        border-color: #1f7ac0;
        box-shadow: 0 0 0 4px rgba(31, 122, 192, 0.15);
    }

    .auth-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #145d9b 0%, #1f7ac0 100%);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 12px 24px rgba(20, 93, 155, 0.24);
    }

    .auth-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 16px 30px rgba(20, 93, 155, 0.3);
    }

    .auth-links {
        text-align: center;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid #e5edf5;
        color: #5f7183;
    }

    .auth-links a {
        color: #165d97;
        text-decoration: none;
        font-weight: 600;
    }

    .auth-links a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <h2 class="auth-title">Sign In</h2>
        <p class="auth-subtitle">Access SPMS with your account credentials.</p>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="auth-btn">Login</button>
        </form>

        <div class="auth-links">
            <a href="{% url 'register_staff' %}">Register as Staff</a> 
        </div>
    </div>
</div>
{% endblock %}
