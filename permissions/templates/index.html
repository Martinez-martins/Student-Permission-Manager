<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kali Linux Web Simulator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ───── RESET ───── */
*{margin:0;padding:0;box-sizing:border-box;font-family:monospace}

/* ───── GLOBAL ───── */
body{
  height:100vh;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  overflow:hidden;
  color:white;
}

/* ───── LOGIN SCREEN ───── */
#login{
  position:fixed;
  inset:0;
  background:#0b1c24;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

#loginBox{
  background:#111;
  padding:30px;
  width:300px;
  border-radius:10px;
  text-align:center;
}

#login input{
  width:100%;
  margin-top:10px;
  padding:8px;
  background:black;
  border:1px solid #333;
  color:white;
}

#login button{
  margin-top:15px;
  width:100%;
  padding:8px;
  background:#00bcd4;
  border:none;
  cursor:pointer;
}

/* ───── TOP BAR ───── */
#topbar{
  height:35px;
  background:rgba(0,0,0,.7);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 15px;
}

/* ───── TASKBAR ───── */
#taskbar{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:40px;
  background:rgba(0,0,0,.75);
  display:flex;
  align-items:center;
  padding:0 10px;
  gap:10px;
}

.task{
  padding:5px 10px;
  background:#222;
  cursor:pointer;
  border-radius:4px;
}

/* ───── DOCK ───── */
#dock{
  position:absolute;
  top:60px;
  left:10px;
  background:rgba(0,0,0,.6);
  padding:10px;
  border-radius:10px;
}

.app{
  width:42px;
  height:42px;
  margin-bottom:10px;
  background:#222;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  border-radius:8px;
}

/* ───── WINDOWS ───── */
.window{
  position:absolute;
  width:650px;
  height:420px;
  background:#1b1b1b;
  border-radius:8px;
  box-shadow:0 20px 40px rgba(0,0,0,.6);
  overflow:hidden;
}

.titlebar{
  height:30px;
  background:#111;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 10px;
  cursor:move;
}

.controls span{
  width:12px;height:12px;
  border-radius:50%;
  display:inline-block;
  margin-left:6px;
  cursor:pointer;
}

.close{background:#ff5f56}
.min{background:#ffbd2e}
.max{background:#27c93f}

.content{height:calc(100% - 30px);background:black}

/* ───── TERMINAL ───── */
#terminal{
  padding:10px;
  font-size:14px;
}

#terminal input{
  width:100%;
  background:black;
  border:none;
  color:#00ff00;
  outline:none;
}

/* ───── FIREFOX ───── */
#firefoxUI{
  background:#eee;
  height:100%;
  color:black;
}

#firefoxUI .bar{
  background:#ddd;
  padding:5px;
}

#firefoxUI .page{
  padding:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div id="loginBox">
    <h3>Kali Linux</h3>
    <input id="user" placeholder="Username">
    <input id="pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>
</div>

<!-- TOP BAR -->
<div id="topbar">
  <div>Applications</div>
  <div id="clock"></div>
</div>

<!-- DOCK -->
<div id="dock">
  <div class="app" onclick="openTerminal()">💻</div>
  <div class="app" onclick="openFirefox()">🌐</div>
  <div class="app" onclick="lock()">🔒</div>
</div>

<!-- TASKBAR -->
<div id="taskbar"></div>

<script>
let z=10;
let taskbar=document.getElementById("taskbar");

/* CLOCK */
setInterval(()=>clock.innerText=
  new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),1000);

/* LOGIN */
function login(){
  document.getElementById("login").style.display="none";
}

/* LOCK */
function lock(){
  document.getElementById("login").style.display="flex";
}

/* WINDOW */
function createWindow(title,content){
  const w=document.createElement("div");
  w.className="window";
  w.style.top="80px";
  w.style.left="120px";
  w.style.zIndex=++z;

  w.innerHTML=`
    <div class="titlebar">
      <span>${title}</span>
      <div class="controls">
        <span class="min"></span>
        <span class="max"></span>
        <span class="close"></span>
      </div>
    </div>
    <div class="content">${content}</div>
  `;

  document.body.appendChild(w);
  drag(w);

  const task=document.createElement("div");
  task.className="task";
  task.innerText=title;
  task.onclick=()=>w.style.display="block";
  taskbar.appendChild(task);

  w.querySelector(".close").onclick=()=>{w.remove();task.remove()};
  w.querySelector(".min").onclick=()=>w.style.display="none";
  w.querySelector(".max").onclick=()=>w.classList.toggle("maximized");
}

/* DRAG */
function drag(win){
  let bar=win.querySelector(".titlebar"),x,y,dragging=false;
  bar.onmousedown=e=>{
    dragging=true;x=e.clientX-win.offsetLeft;y=e.clientY-win.offsetTop;
    win.style.zIndex=++z;
  };
  document.onmousemove=e=>{
    if(dragging){
      win.style.left=e.clientX-x+"px";
      win.style.top=e.clientY-y+"px";
    }
  };
  document.onmouseup=()=>dragging=false;
}

/* TERMINAL */
function openTerminal(){
  createWindow("Terminal",
    `<div id="terminal">
      root@kali:~$ <input onkeydown="cmd(event)">
    </div>`
  );
}

function cmd(e){
  if(e.key==="Enter"){
    e.target.insertAdjacentHTML("beforebegin","<br>command not found<br>root@kali:~$ ");
    e.target.value="";
  }
}

/* FIREFOX */
function openFirefox(){
  createWindow("Firefox ESR",
    `<div id="firefoxUI">
      <div class="bar">Firefox ESR — https://www.kali.org</div>
      <div class="page">
         
      </div>
    </div>`
  );
}
</script>

</body>
</html>
